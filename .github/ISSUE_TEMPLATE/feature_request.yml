name: Feature request
description: Proponer una mejora trazable
title: "[FEAT] "
labels: [enhancement, triage]
body:
  - type: textarea
    id: story
    attributes:
      label: Historia de usuario
      placeholder: Como..., quiero..., para...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Criterios de aceptación
    validations:
      required: true
