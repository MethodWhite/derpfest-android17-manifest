name: Documentation check
on:
  pull_request:
    paths: ['docs/**', 'README.md', 'PORT_STATUS.md', '.github/**']
  push:
    branches: [main]
jobs:
  markdown:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - name: Check required documentation
        run: |
          test -f README.md
          test -f docs/00-index.md
          test -f docs/01-project-charter.md
          test -f docs/02-scrum-ban.md
          test -f docs/04-bug-reporting.md
          grep -Eq 'Android 17' README.md
          grep -Eq 'miami' README.md
      - name: Check markdown links are not empty
        run: |
          if rg -nE '\\]\\(\\s*\\)' README.md docs .github; then
            echo 'Empty Markdown link found'
            exit 1
          fi
