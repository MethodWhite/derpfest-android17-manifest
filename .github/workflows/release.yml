name: Release metadata
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release inputs
        run: |
          test -f README.md
          test -f PORT_STATUS.md
          test -f docs/30-validation-matrix.md
          test -f docs/31-release-and-updates.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "DerpFest miami $GITHUB_REF_NAME"
